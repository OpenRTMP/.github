name: Interoperability report
description: Report a tested OBS, FFmpeg, player, codec, RTMP, or RTMPS combination
title: "interop: "
body:
  - type: markdown
    attributes:
      value: |
        Use this form for compatibility evidence, including successful combinations and reduced failures. Do not include real stream keys, API tokens, private certificates, or production hostnames.

  - type: input
    id: openrtmp
    attributes:
      label: OpenRTMP versions
      placeholder: "librtmp2 ..., server ..., panel ..."
    validations:
      required: true

  - type: textarea
    id: publisher
    attributes:
      label: Publisher
      placeholder: |
        Software/version:
        Operating system:
        RTMP or RTMPS:
        Video codec/settings:
        Audio codec/settings:
    validations:
      required: true

  - type: textarea
    id: player
    attributes:
      label: Player or downstream consumer
      placeholder: |
        Software/version:
        Operating system:
        Connection URL shape:
        Decoder/hardware notes:
    validations:
      required: true

  - type: dropdown
    id: result
    attributes:
      label: Result
      options:
        - Successful publish and playback
        - Publish succeeds, playback fails
        - Publisher cannot connect or authenticate
        - Player cannot connect or authenticate
        - Reconnect or late-join failure
        - Degraded or intermittent behavior
    validations:
      required: true

  - type: checkboxes
    id: coverage
    attributes:
      label: Scenarios tested
      options:
        - label: Initial publisher and player connection
        - label: Player joining after the stream started
        - label: Publisher disconnect and reconnect
        - label: Multiple simultaneous players
        - label: Server/container restart
        - label: Sustained stream longer than 30 minutes
        - label: RTMPS certificate validation

  - type: textarea
    id: observations
    attributes:
      label: Observations and sanitized evidence
      description: Include relevant logs, statistics, timings, and any required workaround.
    validations:
      required: true

  - type: checkboxes
    id: consent
    attributes:
      label: Publication
      options:
        - label: This report contains no credentials or private data and may be used in a public compatibility matrix.
          required: true
