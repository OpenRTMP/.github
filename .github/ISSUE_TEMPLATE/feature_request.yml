name: Feature request
description: Propose a focused improvement with a testable completion definition
title: "feature: "
body:
  - type: markdown
    attributes:
      value: |
        OpenRTMP intentionally remains focused on RTMP/RTMPS, Enhanced RTMP, and the application layer around those protocols. Explain the user problem before proposing a specific implementation.

  - type: dropdown
    id: component
    attributes:
      label: Proposed component
      options:
        - librtmp2 protocol library or C FFI
        - librtmp2-server
        - librtmp2-server-panel
        - openrtmp.org documentation or guide
        - Cross-repository / design discussion needed
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Who experiences the problem, and what cannot be done reliably today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe externally visible behavior, not only internal implementation details.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include existing OpenRTMP workarounds, adjacent projects, or separate services that could solve the problem.
    validations:
      required: false

  - type: textarea
    id: compatibility
    attributes:
      label: Compatibility and interoperability impact
      description: Consider public APIs, FFI, configuration, database, Docker, URLs, statistics formats, OBS/FFmpeg/player behavior, and upgrades.
    validations:
      required: false

  - type: textarea
    id: completion
    attributes:
      label: Testable completion definition
      placeholder: |
        - [ ] Behavior is covered by ...
        - [ ] Documentation is updated in ...
        - [ ] Interoperability is verified with ...
    validations:
      required: true

  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This belongs in OpenRTMP rather than an external transcoder, packager, recorder, or viewer platform.
        - label: I understand that parser support and live-session integration are separate scopes.
        - label: I am willing to help test or implement this feature.
