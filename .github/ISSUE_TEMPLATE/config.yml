  - name: Documentation and quickstart
    url: https://openrtmp.org/quickstart/
    about: Start with the Docker/OBS guide and linked troubleshooting steps.
  - name: Security vulnerability
    url: https://github.com/OpenRTMP/.github/blob/main/SECURITY.md
    about: Do not disclose security-sensitive details in a public issue.
